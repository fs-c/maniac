name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      osu_tag:
        description: "Optional ppy/osu release tag (e.g. 2026.804.2-lazer)"
        required: false
      build_expiry:
        description: "Optional demo build expiry, UTC ISO-8601 (e.g. 2026-10-15 or 2026-10-15T00:00:00Z). Empty = no expiry."
        required: false

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test Core
        run: dotnet test tests/Maniac.Core.Tests/Maniac.Core.Tests.csproj -c Release --nologo

  build-against-lazer:
    runs-on: windows-latest
    env:
      MANIAC_BUILD_EXPIRY: ${{ github.event.inputs.build_expiry }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve osu!lazer release
        id: osu
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OSU_TAG: ${{ github.event.inputs.osu_tag }}
        run: |
          ./scripts/resolve-osu-release.ps1

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/osu-cache
          key: osulazer-nupkg-${{ steps.osu.outputs.tag }}

      # Velopack install.exe needs shortcuts/registry/Win32 process paths that
      # GitHub-hosted runners do not provide so we unpack the release nupkg instead.
      - name: Extract osu!lazer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cache = Join-Path $env:RUNNER_TEMP "osu-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          $nupkg = Join-Path $cache "osu-full.nupkg"
          if (-not (Test-Path $nupkg)) {
            Write-Host "Downloading $($env:OSU_NUPKG_URL)"
            curl.exe -L --fail --retry 3 -o $nupkg $env:OSU_NUPKG_URL
            if ($LASTEXITCODE -ne 0) { throw "nupkg download failed with $LASTEXITCODE" }
          }
          $extract = Join-Path $env:RUNNER_TEMP "osu-nupkg"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          New-Item -ItemType Directory -Force $extract | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg, $extract)
          $game = Get-ChildItem $extract -Recurse -Filter osu.Game.dll | Select-Object -First 1
          if (-not $game) { throw "osu.Game.dll not found in nupkg" }
          Write-Host "LazerDir $($game.DirectoryName)"
          "LAZER_DIR=$($game.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build Maniac.sln -c Release -p:LazerDir=$env:LAZER_DIR -p:ManiacBuildExpiry=$env:MANIAC_BUILD_EXPIRY --nologo

      - name: Test
        env:
          LAZER_DIR: ${{ env.LAZER_DIR }}
        run: dotnet test Maniac.sln -c Release -p:LazerDir=$env:LAZER_DIR --no-build --nologo

      - name: Pack
        run: pwsh ./scripts/pack.ps1 -Configuration Release
